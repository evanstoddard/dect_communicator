manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: ovyl
      url-base: https://github.com/Ovyl

  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.1.1
      import: true

    - name: ovyl-zephyr-modules
      remote: ovyl
      repo-path: ovyl-zephyr-modules
      revision: main
      path: modules/ovyl