# This file contains selected Kconfig options for the application.

# Modem
CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_ANTENNA=n

# DECT NR+
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y

# NOTE: This is for US only
CONFIG_CARRIER=1711 
CONFIG_TX_POWER=10

# Hardware Info
CONFIG_HWINFO=y
CONFIG_HWINFO_NRF=y

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_ASSERT=y

# Shell
CONFIG_SHELL=y

# Network Buffer Support
CONFIG_NET_BUF=y

# Entropy
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# Silence TF-M logging — UART1 is shared with HCI H4 to the nRF5340
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# Bluetooth Host (external controller on nRF5340 via HCI H4 over UART1)
CONFIG_BT=y
CONFIG_BT_H4=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="DECT Communicator"
CONFIG_UART_INTERRUPT_DRIVEN=y
